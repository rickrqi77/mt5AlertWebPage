# TestFlight 线：云端 Mac 上把手机 + 手表 + 复杂功能打成一个 App Store
# 签名包并上传 App Store Connect（免 UDID；手顺见本地文档
# goldalert-testflight-steps.md）。签名材料全部来自仓库 Secrets：
# DIST_P12_BASE64 / DIST_P12_PASSWORD / PROFILE_PHONE_BASE64 /
# PROFILE_WATCH_BASE64 / PROFILE_COMPLICATION_BASE64 /
# ASC_KEY_P8_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID。
# 先只手动触发；跑通后再考虑加 push 自动触发。
name: Upload TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode signing materials
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          PROFILE_PHONE_BASE64: ${{ secrets.PROFILE_PHONE_BASE64 }}
          PROFILE_WATCH_BASE64: ${{ secrets.PROFILE_WATCH_BASE64 }}
          PROFILE_COMPLICATION_BASE64: ${{ secrets.PROFILE_COMPLICATION_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing" ~/.appstoreconnect/private_keys
          printf '%s' "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/dist.p12"
          printf '%s' "$PROFILE_PHONE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/phone.mobileprovision"
          printf '%s' "$PROFILE_WATCH_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/watch.mobileprovision"
          printf '%s' "$PROFILE_COMPLICATION_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/comp.mobileprovision"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          ls -la "$RUNNER_TEMP/signing"
          shasum -a 256 "$RUNNER_TEMP/signing/dist.p12"

      - name: Import certificate and install profiles
        env:
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/signing/dist.p12" -k "$RUNNER_TEMP/build.keychain" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$RUNNER_TEMP/build.keychain"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          for f in phone watch comp; do
            security cms -D -i "$RUNNER_TEMP/signing/$f.mobileprovision" > "$RUNNER_TEMP/signing/$f.plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/signing/$f.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/signing/$f.plist")
            cp "$RUNNER_TEMP/signing/$f.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision
            echo "$f -> $name ($uuid)"
          done

      - name: Prepare app icons
        run: |
          base64 -d < gold-alert/ios/GoldAlert/Icon.png.b64 > /tmp/icon-1024.png
          mkdir -p gold-alert/testflight/PhoneAssets/Assets.xcassets/AppIcon.appiconset
          cp /tmp/icon-1024.png gold-alert/testflight/PhoneAssets/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          cat > gold-alert/testflight/PhoneAssets/Assets.xcassets/Contents.json <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > gold-alert/testflight/PhoneAssets/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          mkdir -p gold-alert/watchos/GoldAlertWatch/Assets.xcassets/AppIcon.appiconset
          WICON=gold-alert/watchos/GoldAlertWatch/Assets.xcassets/AppIcon.appiconset
          for px in 48 55 58 66 80 87 88 92 100 102 108 172 196 216 234 258; do
            sips -z $px $px /tmp/icon-1024.png --out $WICON/icon-$px.png > /dev/null
          done
          cp /tmp/icon-1024.png $WICON/icon-1024.png
          cat > gold-alert/watchos/GoldAlertWatch/Assets.xcassets/Contents.json <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > $WICON/Contents.json <<'JSON'
          {"images":[{"filename":"icon-48.png","idiom":"watch","role":"notificationCenter","scale":"2x","size":"24x24","subtype":"38mm"},{"filename":"icon-55.png","idiom":"watch","role":"notificationCenter","scale":"2x","size":"27.5x27.5","subtype":"42mm"},{"filename":"icon-66.png","idiom":"watch","role":"notificationCenter","scale":"2x","size":"33x33","subtype":"45mm"},{"filename":"icon-58.png","idiom":"watch","role":"companionSettings","scale":"2x","size":"29x29"},{"filename":"icon-87.png","idiom":"watch","role":"companionSettings","scale":"3x","size":"29x29"},{"filename":"icon-80.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"40x40","subtype":"38mm"},{"filename":"icon-88.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"44x44","subtype":"40mm"},{"filename":"icon-92.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"46x46","subtype":"41mm"},{"filename":"icon-100.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"50x50","subtype":"44mm"},{"filename":"icon-102.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"51x51","subtype":"45mm"},{"filename":"icon-108.png","idiom":"watch","role":"appLauncher","scale":"2x","size":"54x54","subtype":"49mm"},{"filename":"icon-172.png","idiom":"watch","role":"quickLook","scale":"2x","size":"86x86","subtype":"38mm"},{"filename":"icon-196.png","idiom":"watch","role":"quickLook","scale":"2x","size":"98x98","subtype":"42mm"},{"filename":"icon-216.png","idiom":"watch","role":"quickLook","scale":"2x","size":"108x108","subtype":"44mm"},{"filename":"icon-234.png","idiom":"watch","role":"quickLook","scale":"2x","size":"117x117","subtype":"45mm"},{"filename":"icon-258.png","idiom":"watch","role":"quickLook","scale":"2x","size":"129x129","subtype":"49mm"},{"filename":"icon-1024.png","idiom":"watch-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON

      - name: Generate project and set build number
        working-directory: gold-alert/testflight
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ../ios/GoldAlert/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ../watchos/GoldAlertWatch/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ../watchos/GoldAlertComplication/Info.plist
          echo "build number: $BUILD_NUMBER"

      - name: Archive
        working-directory: gold-alert/testflight
        run: |
          xcodebuild archive \
            -project GoldAlertTF.xcodeproj \
            -scheme GoldAlertTF \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GoldAlert.xcarchive"

      - name: Export IPA
        working-directory: gold-alert/testflight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GoldAlert.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist
          ls -la "$RUNNER_TEMP/export"

      - name: Keep IPA artifact for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldAlert-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 3

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "uploading: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
