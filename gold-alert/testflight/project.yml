# TestFlight 统一工程：手机 + 手表 + 复杂功能三件套，在 GitHub 云端
# Mac 上 archive 成 App Store 包（见 .github/workflows/upload-testflight.yml）。
# 与 watchos/project.yml 的区别：多了手机 target 并把手表嵌进手机；
# 复杂功能 Bundle ID 用 .comp（ren 2026-11-16 在门户实际建成的 ID，
# .complication 当时建不了）；签名 Manual + App Store 描述文件，
# 描述文件名与门户所建一致（已从下载文件回读核对）。
name: GoldAlertTF
options:
  bundleIdPrefix: com.rickrqi77
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Distribution
    DEVELOPMENT_TEAM: YY8LQA5RA9
targets:
  GoldAlert:
    type: application
    platform: iOS
    sources:
      - path: ../ios/GoldAlert/Sources/GoldAlert
      - path: PhoneAssets/Assets.xcassets
    info:
      path: ../ios/GoldAlert/Info.plist
    entitlements:
      path: ../ios/GoldAlert/GoldAlert.entitlements
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.rickrqi77.goldalert
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: GoldAlert AppStore
    dependencies:
      - target: GoldAlertWatch
        embed: true
  GoldAlertWatch:
    type: application
    platform: watchOS
    sources:
      - path: ../watchos/GoldAlertWatch
    info:
      path: ../watchos/GoldAlertWatch/Info.plist
      properties:
        CFBundleDisplayName: 提醒事项
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rickrqi77.goldalert
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.rickrqi77.goldalert.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: GoldAlert Watch AppStore
    dependencies:
      - target: GoldAlertComplication
        embed: true
  GoldAlertComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: ../watchos/GoldAlertComplication
    info:
      path: ../watchos/GoldAlertComplication/Info.plist
      properties:
        CFBundleDisplayName: 金价
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.rickrqi77.goldalert.watchkitapp.comp
        TARGETED_DEVICE_FAMILY: "4"
        PROVISIONING_PROFILE_SPECIFIER: GoldAlert Complication AppStore
schemes:
  GoldAlertTF:
    build:
      targets:
        GoldAlert: all
    archive:
      config: Release
